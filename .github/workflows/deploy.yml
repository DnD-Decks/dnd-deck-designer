name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "asset-pipeline/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_lQs3paG1cTYELKLUZN7yMfhx
  VERCEL_PROJECT_ID: prj_htJcvkNhD8g3ClAyNGArzzJrH0hu

jobs:
  blue-ball:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/blue-ball.yml

  deploy:
    needs: blue-ball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel production
        run: npx --yes vercel@59.11.2 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
